.app{width:min(96vw,1120px);height:min(94vh,820px);display:grid;grid-template-columns:225px 1fr;gap:24px;align-items:center}
.side-menu{height:100%;padding:18px 14px;border-radius:25px;background:var(--panel);backdrop-filter:blur(16px);border:1px solid #ffffff18;box-shadow:0 25px 80px #0009;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.brand{font-size:23px;line-height:.9;font-weight:900;letter-spacing:-1px;padding:4px 7px 15px;text-align:left}.brand span{font-size:19px;opacity:.7}
.menu-title{font-size:9px;letter-spacing:1.4px;font-weight:900;color:#8993ad;margin:8px 7px 1px}
.mode-btn,.new-game-btn{width:100%;border:1px solid transparent;border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:8px;background:#ffffff09;color:#fff;font:800 11px 'Nunito',sans-serif;cursor:pointer;box-shadow:none;transition:.16s}
.mode-btn:hover,.mode-btn.active{background:#6574ff25;border-color:#6574ff50}
#difficulty{width:100%;border:1px solid #ffffff16;border-radius:11px;padding:9px;background:#151b2d;color:#fff;font:800 11px 'Nunito',sans-serif;outline:none}
.ladder-panel{display:none;flex:1;min-height:0;background:#080d19a8;border:1px solid #ffffff0b;border-radius:14px;padding:9px;overflow:hidden}.ladder-panel.show{display:flex;flex-direction:column}
.ladder-head{display:flex;justify-content:space-between;color:#9da6bb;font-size:9px;margin-bottom:7px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow-y:auto;overflow-x:hidden;padding:4px 3px 8px;scrollbar-width:none;max-height:calc(100vh - 250px)}.levels::-webkit-scrollbar{display:none}
.level{aspect-ratio:1;border:1px solid #ffffff10;border-radius:12px;background:linear-gradient(145deg,#293047,#1c2336);color:#aab2c5;font:900 15px 'Nunito';cursor:pointer;padding:0;min-height:48px;transition:transform .18s,box-shadow .18s,background .18s}.level:hover:not(:disabled){transform:translateY(-2px) scale(1.04);box-shadow:0 8px 18px #0005}.level.current{background:linear-gradient(145deg,var(--accent),#4858e8);color:#fff;box-shadow:0 0 20px #6574ff77,0 7px 18px #0005;animation:levelBeat 1.8s ease-in-out infinite}.level.done{background:linear-gradient(145deg,#20bd86,#159a6c);color:#fff}.level.locked{opacity:.24;cursor:not-allowed;filter:saturate(.35)}
.new-game-btn{margin-top:auto;justify-content:center;background:linear-gradient(135deg,#6574ff,#4654e9);box-shadow:0 8px 20px #4654e955}
.sound-label{display:flex;align-items:center;gap:6px;color:#8e98ae;font-size:9px;padding:3px 6px}
.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.game{width:min(100%,690px);justify-self:center;text-align:center;padding:8px 0}
.game-head{display:flex;justify-content:center;gap:7px;margin-bottom:6px}
.score-box,.level-box{background:#151b2de8;border:1px solid #ffffff12;border-radius:14px;padding:6px 13px;color:#98a2b9;font-size:9px;box-shadow:0 10px 30px #0004}.score{font-size:20px;font-weight:900;color:#fff}
.level-box{display:flex;align-items:center;gap:5px}.level-box b{font-size:17px;color:#fff}
.goal{min-height:18px;font-size:10px;font-weight:800;color:#e1e5f0;margin-bottom:6px}
#board{--board-size:8;width:min(78vh,590px,68vw);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(var(--board-size),1fr);gap:5px;padding:7px;background:linear-gradient(145deg,#252d45ee,#151b2cee);border:1px solid #ffffff12;border-radius:21px;box-shadow:0 25px 70px #0009;transition:width .25s ease}
.cell{position:relative;background:#30384d;border-radius:7px;transition:transform .1s,filter .1s;overflow:hidden}.cell:after,.block:after{content:"";position:absolute;left:12%;right:12%;top:7%;height:28%;border-radius:50%;background:#fff5;filter:blur(2px)}.cell.filled{box-shadow:inset 0 -5px #0003,0 2px 8px #0005}.cell.preview{opacity:.38;transform:scale(.88)}.cell.clearing{animation:clearCell .34s ease forwards}
@keyframes clearCell{0%{transform:scale(1);opacity:1}45%{transform:scale(1.18);filter:brightness(1.8)}100%{transform:scale(.05);opacity:0}}
.pieces{margin-top:12px;min-height:105px;display:flex;justify-content:space-around;align-items:center}.piece{width:105px;height:105px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:.15s;will-change:transform}.piece:hover{transform:translateY(-4px) scale(1.04)}.piece.dragging{opacity:.16;transform:scale(.8)}
.mini-grid{display:grid;gap:4px}.block,.empty-block{width:25px;height:25px}.block{position:relative;border-radius:6px;box-shadow:inset 0 -3px #0003,0 3px 8px #0006}
.hint{color:#a4aec2;font-size:9px;margin-top:1px;display:flex;align-items:center;justify-content:center;gap:5px}.drag-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;will-change:transform;filter:drop-shadow(0 18px 18px #0008)}
.rotation-badge{position:fixed;z-index:110;pointer-events:none;left:50%;top:12%;padding:5px 9px;border-radius:9px;background:#111629dd;font-size:10px;font-weight:900;opacity:0;transform:translateY(6px);transition:.12s}.rotation-badge.show{opacity:1;transform:translateY(0)}
.combo{position:fixed;z-index:105;left:50%;top:48%;transform:translate(-50%,-50%) scale(.4);font-size:38px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 7px 25px #000a;white-space:nowrap}.combo.show{animation:combo .8s ease}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(2deg)}70%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-85%) scale(.8)}}
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:120;animation:particle .7s ease-out forwards}@keyframes particle{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

<script>
const $=id=>document.getElementById(id);

const colors=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff924c","#00c2a8","#e85dff"];

const SCORE_THEMES=[
 {min:0,cls:"",name:"Классический стиль"},

 {min:1500,cls:"theme-violet",name:"🔮 НЕОНОВЫЙ режим"},

let activeTheme="";
function updateTheme(force=false){
 let chosen=SCORE_THEMES[0];

  document.body.classList.remove("theme-sky","theme-violet","theme-fire","theme-gold","theme-neon");

   $("board").style.filter="";

}

function ladderGoal(lv){return {score:70+lv*35+Math.floor(lv/10)*100,lines:Math.max(1,Math.ceil(lv/7))}}
function ladderSize(lv){if(lv<=20)return 10;if(lv<=45)return 9;if(lv<=70)return 8;if(lv<=85)return 7;return 6}
function renderLevels(){
 const box=$("levels"); box.innerHTML="";

 for(let i=1;i<=100;i++){
   const b=document.createElement("button");
   const isUnlocked=i<=unlocked;
   b.className="level "+(completedLevels.includes(i)?"done ":"")+(i===ladderLevel?"current ":"")+(isUnlocked?"":"locked");
   b.textContent=i;
   b.disabled=!isUnlocked;
   b.onclick=()=>{
     if(!isUnlocked)return;
     ladderLevel=i;
     localStorage.setItem("blockBlastLadderLevel",ladderLevel);
     sceneTransition();
     startLadderLevel();
   };
   box.appendChild(b);

}

function updateModeUI(){document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));$("ladderPanel").classList.toggle("show",mode==="ladder");$("difficultyWrap").style.display=mode==="standard"?"block":"none";$("levelBox").style.display=mode==="ladder"?"flex":"none";$("currentLevel").textContent=mode==="ladder"?ladderLevel:1;$("goal").textContent=mode==="ladder"?`Уровень ${ladderLevel} · Цель: ${ladderGoal(ladderLevel).score} очков · ${ladderGoal(ladderLevel).lines} линий`:"Заполняй линии и набирай очки"}

 const w=$("sceneWipe");w.classList.add("on");setTimeout(()=>w.classList.remove("on"),280);
}
function setMode(m){
 mode=m;localStorage.setItem("blockBlastMode",mode);
 sceneTransition();updateModeUI();sound("click");newGame();renderLevels();
}

}

function createBoard(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(null));$("board").style.setProperty("--board-size",SIZE);$("board").innerHTML="";for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let el=document.createElement("div");el.className="cell";el.dataset.row=r;el.dataset.col=c;$("board").appendChild(el)}}

function renderPieces(){$("pieces").innerHTML="";pieces.forEach((p,i)=>{let el=document.createElement("div");el.className="piece";el.dataset.index=i;let grid=document.createElement("div");grid.className="mini-grid";grid.style.gridTemplateColumns=`repeat(${p.shape[0].length},25px)`;p.shape.forEach(row=>row.forEach(v=>{let b=document.createElement("div");if(v){b.className="block";b.style.background=p.color}else{b.className="empty-block";b.style.visibility="hidden"}grid.appendChild(b)}));el.appendChild(grid);$("pieces").appendChild(el);el.addEventListener("pointerdown",startDrag);el.addEventListener("contextmenu",e=>{e.preventDefault();rotatePiece(i)});el.addEventListener("mouseenter",()=>sound("hover"))})}

function cellAt(x,y){let e=document.elementFromPoint(x,y);return e?.classList.contains("cell")?e:null}

function startDrag(e){if(e.button===2)return;initAudio();let el=e.currentTarget,i=+el.dataset.index,grid=el.querySelector(".mini-grid"),rect=grid.getBoundingClientRect(),step=29;let gx=Math.max(0,Math.min(pieces[i].shape[0].length-1,Math.floor((e.clientX-rect.left)/step))),gy=Math.max(0,Math.min(pieces[i].shape.length-1,Math.floor((e.clientY-rect.top)/step)));drag={...pieces[i],index:i,el,ghost:makeGhost(pieces[i]),x:e.clientX,y:e.clientY,tx:e.clientX,ty:e.clientY,vx:0,vy:0,spin:0,spinV:0,angle:0,targetAngle:0,lastX:e.clientX,lastY:e.clientY,lastTime:performance.now(),pos:null,grabX:gx,grabY:gy};el.classList.add("dragging");el.setPointerCapture?.(e.pointerId);requestAnimationFrame(physicsFrame);sound("pickup");document.addEventListener("pointermove",move);document.addEventListener("pointerup",end)}
function move(e){if(!drag)return;let now=performance.now(),dt=Math.max(8,now-drag.lastTime),dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY,speed=Math.hypot(dx,dy)/(dt/16);drag.tx=e.clientX;drag.ty=e.clientY;if(speed>7){drag.spinV+=dx*.13;if(Math.random()<.08)sound("spin")}drag.spinV*=.9;drag.spin+=drag.spinV;drag.targetAngle=Math.max(-10,Math.min(10,dx*.12));drag.lastX=e.clientX;drag.lastY=e.clientY;drag.lastTime=now;clearPreview();let cell=cellAt(e.clientX,e.clientY);if(cell){let br=$("board").getBoundingClientRect(),cw=(br.width-14-(SIZE-1)*5)/SIZE,pitch=cw+5,col=Math.floor((e.clientX-br.left-7)/pitch)-drag.grabX,row=Math.floor((e.clientY-br.top-7)/pitch)-drag.grabY;if(canPlace(drag.shape,row,col)){drag.pos={r:row,c:col};preview(drag.shape,row,col,drag.color)}}}
function physicsFrame(){if(!drag)return;let k=.23,fr=.79;drag.vx+=(drag.tx-drag.x)*k;drag.vy+=(drag.ty-drag.y)*k;drag.vx*=fr;drag.vy*=fr;drag.x+=drag.vx;drag.y+=drag.vy;drag.angle+=(drag.targetAngle-drag.angle)*.2;let w=drag.shape[0].length,h=drag.shape.length,st=Math.min(.14,Math.hypot(drag.vx,drag.vy)*.004);drag.ghost.style.transform=`translate3d(${drag.x-(drag.grabX+.5)*25}px,${drag.y-(drag.grabY+.5)*25}px,0) rotate(${drag.spin+drag.angle}deg) scale(${1.08+st},${1.08-st*.45})`;requestAnimationFrame(physicsFrame)}
function end(){if(!drag)return;clearPreview();drag.el.classList.remove("dragging");let d=drag;drag=null;if(d.pos&&canPlace(d.shape,d.pos.r,d.pos.c)){d.ghost.style.transition="transform .18s cubic-bezier(.15,1.55,.3,1)";d.ghost.style.transform+=" scale(.82)";place(d.shape,d.pos.r,d.pos.c,d.color);pieces.splice(d.index,1);if(!pieces.length)newPieces();else renderPieces();setTimeout(checkGameOver,120)}else{sound("fail");d.ghost.style.transition="transform .2s ease";d.ghost.style.transform+=" scale(.75)"}setTimeout(()=>d.ghost.remove(),220);document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",end)}
document.addEventListener("keydown",e=>{if(!drag)return;if(e.key.toLowerCase()==="r"||e.key===" "){e.preventDefault();rotateDragged()}})
document.addEventListener("wheel",e=>{if(!drag)return;e.preventDefault();rotateDragged(e.deltaY>0?1:3)},{passive:false})

function canPlace(shape,r,c){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++)if(shape[y][x]){let R=r+y,C=c+x;if(R<0||R>=SIZE||C<0||C>=SIZE||board[R][C])return false}return true}
function place(shape,r,c,color){let n=0;shape.forEach((row,y)=>row.forEach((v,x)=>{if(v){board[r+y][c+x]=color;n++}}));score+=Math.round(n*DIFFICULTIES[difficulty].scoreMul);levelScore+=n;updateScore();render();sound("place");setTimeout(clearLines,55)}
function clearLines(){let rows=[],cols=[];for(let r=0;r<SIZE;r++)if(board[r].every(Boolean))rows.push(r);for(let c=0;c<SIZE;c++)if(board.every(row=>row[c]))cols.push(c);let total=rows.length+cols.length;if(!total)return;levelLines+=total;combo++;let cells=[];rows.forEach(r=>{for(let c=0;c<SIZE;c++)cells.push([r,c])});cols.forEach(c=>{for(let r=0;r<SIZE;r++)if(!cells.some(q=>q[0]===r&&q[1]===c))cells.push([r,c])});cells.forEach(([r,c])=>{let el=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);if(el){el.classList.add("clearing");particle(el)}});let gained=Math.round((total*10+total*total*5+(combo>1?combo*10:0))*DIFFICULTIES[difficulty].scoreMul);score+=gained;levelScore+=gained;updateScore();sound(total>1?"combo":"line");if(total>1)showCombo(total,combo);setTimeout(()=>{rows.forEach(r=>board[r].fill(null));cols.forEach(c=>board.forEach(row=>row[c]=null));render();ladderCheck()},300)}
function render(){document.querySelectorAll(".cell").forEach(el=>{let r=+el.dataset.row,c=+el.dataset.col;el.classList.remove("filled","preview","clearing");el.style.background="";if(board[r][c]){el.classList.add("filled");el.style.background=board[r][c]}})}
function preview(shape,r,c,color){shape.forEach((row,y)=>row.forEach((v,x)=>{if(!v)return;let R=r+y,C=c+x;if(R>=0&&R<SIZE&&C>=0&&C<SIZE){let el=document.querySelector(`.cell[data-row="${R}"][data-col="${C}"]`);el.classList.add("preview");el.style.background=color}}))}
function clearPreview(){render()}
function particle(el){let r=el.getBoundingClientRect();for(let i=0;i<8;i++){let p=document.createElement("div");p.className="particle";p.style.left=(r.left+r.width/2)+"px";p.style.top=(r.top+r.height/2)+"px";p.style.background=el.style.background||"#fff";p.style.setProperty("--x",(Math.random()*120-60)+"px");p.style.setProperty("--y",(Math.random()*120-60)+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),750)}}
function showCombo(lines,n){let el=$("combo");el.textContent=n>1?`🔥 COMBO ×${n} +${lines}`:`💥 ${lines} ЛИНИИ`;el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}
function updateScore(){
 $("score").textContent=score;
 $("score").classList.remove("flash");void $("score").offsetWidth;$("score").classList.add("flash");
 if(score>best){best=score;localStorage.setItem("blockBlastBest",best);$("best").textContent=best;$("modalBest").textContent=best}
 updateTheme();
}
function applyGravity(){if(!DIFFICULTIES[difficulty].gravity||mode==="ladder")return;for(let c=0;c<SIZE;c++){let w=SIZE-1;for(let r=SIZE-1;r>=0;r--)if(board[r][c]){let v=board[r][c];board[r][c]=null;board[w][c]=v;w--}}render();sound("click")}
function startGravity(){clearInterval(gravityTimer);if(DIFFICULTIES[difficulty].gravity&&mode==="standard")gravityTimer=setInterval(applyGravity,DIFFICULTIES[difficulty].gravity)}
function ladderCheck(){
 if(mode!=="ladder")return;
 let g=ladderGoal(ladderLevel);
 if(levelScore>=g.score&&levelLines>=g.lines){
  if(ladderLevel<100){
   if(!completedLevels.includes(ladderLevel))completedLevels.push(ladderLevel);
   highestUnlocked=Math.max(highestUnlocked,ladderLevel+1);
   localStorage.setItem("blockBlastCompleted",JSON.stringify(completedLevels));
   localStorage.setItem("blockBlastHighest",highestUnlocked);
   ladderLevel++;
   localStorage.setItem("blockBlastLadderLevel",ladderLevel);
   sound("level");renderLevels();showCombo(1,ladderLevel);
   setTimeout(startLadderLevel,850);
  }else{
   if(!completedLevels.includes(ladderLevel))completedLevels.push(ladderLevel);
   highestUnlocked=100;
   localStorage.setItem("blockBlastCompleted",JSON.stringify(completedLevels));
   localStorage.setItem("blockBlastHighest",100);
   $("goal").textContent="🏆 Все 100 уровней пройдены!";
   $("gameOverTitle").textContent="ЫЦУЦАЦАЛЕДДЕР ПРОЙДЕН!";
   $("finalScore").textContent=score;
   $("gameOver").classList.add("show");sound("win");
  }
 }
}
function checkGameOver(){for(const p of pieces)for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(canPlace(p.shape,r,c))return;$("finalScore").textContent=score;$("modalBest").textContent=best;$("gameOverTitle").textContent="Игра окончена!";$("gameOver").classList.add("show");sound("fail")}
function newGame(){
 SIZE=mode==="ladder"?ladderSize(ladderLevel):BOARD_SIZES[difficulty];
 levelScore=0;levelLines=0;score=0;combo=0;
 activeTheme="";
 updateModeUI();updateScore();createBoard();newPieces();render();startGravity();
}

document.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("difficulty").addEventListener("change",()=>{difficulty=$("difficulty").value;localStorage.setItem("blockBlastDifficulty",difficulty);sound("click");newGame()});
$("restart").addEventListener("click",()=>{sound("click");$("gameOver").classList.remove("show");newGame()});
$("again").addEventListener("click",()=>{sound("click");$("gameOver").classList.remove("show");newGame()});

$("best").textContent=best;$("modalBest").textContent=best;$("difficulty").value=difficulty;
highestUnlocked=Math.max(highestUnlocked,ladderLevel);
localStorage.setItem("blockBlastHighest",highestUnlocked);
localStorage.setItem("blockBlastLadderLevel",ladderLevel);
updateModeUI();renderLevels();newGame();
</script>
</body>
</html>
